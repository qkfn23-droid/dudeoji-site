<body>
<header><a href="/jp/">MOGU <span style="color:#00ff41;">Guard</span></a></header>
<div class="container">
    <div class="page-title">
        <h2>🎲 パスワード生成器</h2>
        <p>ハッキング不可能な安全なパスワードを作成</p>
    </div>
    <div class="pw-display">
        <div class="pw-text" id="pwText">生成ボタンを押してください</div>
        <button class="pw-copy" onclick="copyPw()">コピー</button>
    </div>

    <div class="controls">
        <div class="control-row">
            <label>長さ</label>
            <input type="range" id="pwLen" min="8" max="64" value="16" oninput="document.getElementById('lenVal').textContent=this.value">
            <span class="len-value" id="lenVal">16</span>
        </div>
        <div class="control-row"><label>小文字 (a-z)</label><input type="checkbox" id="optLower" checked></div>
        <div class="control-row"><label>大文字 (A-Z)</label><input type="checkbox" id="optUpper" checked></div>
        <div class="control-row"><label>数字 (0-9)</label><input type="checkbox" id="optDigit" checked></div>
        <div class="control-row"><label>特殊文字 (!@#$%)</label><input type="checkbox" id="optSpecial" checked></div>
    </div>
    <button class="gen-btn" onclick="generate()">🎲 パスワード生成</button>
    <div class="history">
        <div class="history-title">📋 最近の生成履歴</div>
        <div id="historyList"><div style="color:#333;font-size:13px;">まだパスワードが生成されていません</div></div>

<div style="text-align:center;padding:20px 0;border-top:1px solid #1a3a1a;margin-top:30px;"><span style="font-size:12px;color:#333;margin-right:8px;">共有:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1da1f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:5px 10px;background:#1877f2;color:#fff;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;">Facebook</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:5px 10px;background:#333;color:#0f0;border-radius:4px;text-decoration:none;font-size:11px;margin:3px;font-family:monospace;">URLコピー</a></div>
<footer>&copy; 2025 MOGU Guard</footer>
<script>
const history = [];
function generate() {
    let chars = '';
    if (document.getElementById('optLower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
    if (document.getElementById('optUpper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if (document.getElementById('optDigit').checked) chars += '0123456789';
    if (document.getElementById('optSpecial').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
    if (!chars) { alert('少なくとも1つの文字種を選択してください。'); return; }
    const len = parseInt(document.getElementById('pwLen').value);
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    let pw = '';
    for (let i = 0; i < len; i++) pw += chars[arr[i] % chars.length];
    document.getElementById('pwText').textContent = pw;
    const charsetSize = chars.length;
    const combinations = Math.pow(charsetSize, len);
    const seconds = combinations / 1e9;
    let timeStr, color;
    if (seconds < 3600) { timeStr = '⚠️ 弱い'; color = '#ff5252'; }
    else if (seconds < 86400*365*100) { timeStr = '🟡 普通 (' + formatTime(seconds) + ')'; color = '#ffeb3b'; }
    else { timeStr = '🟢 非常に強い (' + formatTime(seconds) + ')'; color = '#00ff41'; }
    document.getElementById('pwStrength').innerHTML = `ハッキング時間: <strong style="color:${color}">` + timeStr + `</strong>`;
    history.unshift(pw);
    if (history.length > 5) history.pop();
    document.getElementById('historyList').innerHTML = history.map(p =>
        `<div class="history-item"><span>${p}</span><button class="copy-btn" onclick="navigator.clipboard.writeText('${p}');this.textContent='✅'">コピー</button></div>`
    ).join('');
}
function copyPw() {
    const pw = document.getElementById('pwText').textContent;
    if (pw === '生成ボタンを押してください') return;
    navigator.clipboard.writeText(pw);
    const btn = document.querySelector('.pw-copy');
    btn.textContent = '✅ コピー済';
    setTimeout(() => btn.textContent = 'コピー', 2000);
}
function formatTime(s) {
    if (s < 60) return Math.round(s) + ' 秒';
    if (s < 3600) return Math.round(s/60) + ' 分';
    if (s < 86400) return Math.round(s/3600) + ' 時間';
    if (s < 86400*365) return Math.round(s/86400) + ' 日';
    if (s < 86400*365*1000) return Math.round(s/(86400*365)).toLocaleString() + ' 年';
    if (s < 86400*365*1e6) return Math.round(s/(86400*365*1000)).toLocaleString() + ' 千年';
    if (s < 86400*365*1e9) return Math.round(s/(86400*365*1e6)).toLocaleString() + ' 百万年';
    return '宇宙の年齢以上';
}
generate();
</script>

<script>
function switchTab(mode) {
    document.getElementById('encryptPanel').style.display = mode === 'encrypt' ? '' : 'none';
    document.getElementById('decryptPanel').style.display = mode === 'decrypt' ? '' : 'none';
    document.getElementById('tabEnc').classList.toggle('active', mode === 'encrypt');
    document.getElementById('tabDec').classList.toggle('active', mode === 'decrypt');
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'none';
}
async function getKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256'}, keyMaterial, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
function buf2b64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b642buf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }
async function doEncrypt() {
    const text = document.getElementById('encText').value.trim();
    const pass = document.getElementById('encPass').value;
    const err = document.getElementById('errorMsg');
    if (!text) { err.textContent = 'テキストを入力してください。'; err.style.display = 'block'; return; }
    if (!pass) { err.textContent = 'パスワードを入力してください。'; err.style.display = 'block'; return; }
    err.style.display = 'none';
    try {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await getKey(pass, salt);
        const encrypted = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, new TextEncoder().encode(text));
        const result = buf2b64(salt) + '.' + buf2b64(iv) + '.' + buf2b64(encrypted);
        document.getElementById('resultLabel').textContent = '暗号化されたテキスト';
        document.getElementById('resultText').textContent = result;
        document.getElementById('resultBox').style.display = 'block';
    } catch (e) {
        err.textContent = '暗号化失敗：' + e.message; err.style.display = 'block';
    }
}
async function doDecrypt() {
    const text = document.getElementById('decText').value.trim();
    const pass = document.getElementById('decPass').value;
    const err = document.getElementById('errorMsg');
    if (!text) { err.textContent = '暗号化されたテキストを入力してください。'; err.style.display = 'block'; return; }
    if (!pass) { err.textContent = 'パスワードを入力してください。'; err.style.display = 'block'; return; }
    err.style.display = 'none';
    try {
        const parts = text.split('.');
        if (parts.length !== 3) throw new Error('無効な形式');
        const salt = b642buf(parts[0]);
        const iv = b642buf(parts[1]);
        const data = b642buf(parts[2]);
        const key = await getKey(pass, salt);
        const decrypted = await crypto.subtle.decrypt({name: 'AES-GCM', iv}, key, data);
        document.getElementById('resultLabel').textContent = '復号化されたテキスト';
        document.getElementById('resultText').textContent = new TextDecoder().decode(decrypted);
        document.getElementById('resultBox').style.display = 'block';
    } catch (e) {
        err.textContent = '復号化失敗 — パスワードが間違っているかテキストが破損しています。'; err.style.display = 'block';
    }
}
function copyResult() {
    navigator.clipboard.writeText(document.getElementById('resultText').textContent);
    const btn = document.querySelector('.result-copy');
    btn.textContent = '✅ コピー済';
    setTimeout(() => btn.textContent = '📋 コピー', 2000);
}
</script>

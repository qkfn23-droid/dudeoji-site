<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dudeoji Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f0eb;color:#4a3728;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}

.logo{font-size:28px;font-weight:700;color:#5c4033;letter-spacing:2px;margin-bottom:36px;}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:680px;width:100%;padding:0 20px;margin-bottom:24px;}
@media(max-width:500px){.card-grid{grid-template-columns:1fr;max-width:340px;}}

.card{background:#fffbf5;border:1px solid #e6d5c3;border-radius:20px;padding:48px 32px;text-align:center;text-decoration:none;color:#4a3728;transition:all .25s;cursor:pointer;}
.card:hover{border-color:#c9a87c;transform:translateY(-6px);box-shadow:0 12px 40px rgba(92,64,51,0.1);}
.card-icon{font-size:52px;margin-bottom:18px;}
.card-title{font-size:22px;font-weight:700;margin-bottom:10px;}
.card-desc{font-size:13px;color:#a08970;line-height:1.7;}

.lang{margin-top:8px;}
.lang select{padding:4px 8px;border-radius:6px;border:1px solid #d4c4b0;font-size:11px;color:#8b7355;background:#fffbf5;cursor:pointer;outline:none;}
</style>
</head>
<body>

<div class="logo">Dudeoji Studio</div>

<div class="card-grid">
    <a class="card" href="/astro/">
        <div class="card-icon">🔮</div>
        <div class="card-title">점성술</div>
        <div class="card-desc">사주 · 타로 · 베딕 · 럭키타임<br>13가지 전통 점술 도구</div>
    </a>
    <a class="card" href="/penpal/">
        <div class="card-icon">📮</div>
        <div class="card-title">펜팔</div>
        <div class="card-desc">별자리 기반 언어교환<br>게임 · 채팅 · 7개 언어</div>
    </a>
</div>

<div class="lang">
    <select>
        <option selected>KR</option>
        <option>EN</option>
        <option>JP</option>
        <option>DE</option>
        <option>ES</option>
        <option>FR</option>
        <option>PT</option>
    </select>
</div>

</body>
</html>

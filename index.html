<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dudeoji Studio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fa;color:#333;min-height:100vh;display:flex;flex-direction:column;}

.nav{background:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;}
.nav-logo{font-size:17px;font-weight:700;color:#333;text-decoration:none;letter-spacing:1px;}
.nav-lang{padding:5px 10px;border-radius:8px;border:1px solid #ddd;font-size:11px;color:#666;background:#fff;cursor:pointer;outline:none;}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:700px;width:100%;}
@media(max-width:600px){.card-grid{grid-template-columns:1fr;max-width:400px;}}

.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:40px 30px;text-align:center;text-decoration:none;color:#333;transition:all .3s;cursor:pointer;}
.card:hover{border-color:#333;transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,0.08);}
.card-icon{font-size:48px;margin-bottom:16px;}
.card-title{font-size:20px;font-weight:700;margin-bottom:8px;}
.card-desc{font-size:12px;color:#999;line-height:1.6;}

.footer{text-align:center;padding:16px;font-size:11px;color:#ccc;border-top:1px solid #eee;}
</style>
</head>
<body>

<nav class="nav">
    <div></div>
    <select class="nav-lang">
        <option selected>KR</option>
        <option>EN</option>
        <option>JP</option>
        <option>DE</option>
        <option>ES</option>
        <option>FR</option>
        <option>PT</option>
    </select>
</nav>

<div class="main">
    <div style="text-align:center;width:100%;max-width:700px;">
        <div style="font-size:24px;font-weight:700;color:#333;letter-spacing:2px;margin-bottom:30px;">Dudeoji Studio</div>
    <div class="card-grid" style="max-width:700px;width:100%;">
        <a class="card" href="/astro/">
            <div class="card-icon">🔮</div>
            <div class="card-title">점성술</div>
            <div class="card-desc">사주 · 타로 · 베딕 · 럭키타임<br>13가지 전통 점술 도구</div>
        </a>
        <a class="card" href="/penpal/">
            <div class="card-icon">📮</div>
            <div class="card-title">펜팔</div>
            <div class="card-desc">별자리 기반 언어교환<br>게임 · 채팅 · 7개 언어</div>
        </a>
    </div>
    </div>
</div>

<footer class="footer">&copy; 2025 Dudeoji Studio</footer>

</body>
</html>

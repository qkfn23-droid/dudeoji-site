<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🌍 世界時計</h1>
    <p class="subtitle">世界の主要都市の現在時刻</p>
    <div class="clock-grid" id="grid"></div>
</div>
<div class="seo-content">
<div class="seo-section"><h2>世界時計</h2><p>世界の主要都市の現在時刻を確認します。</p></div>
<div class="seo-section"><h2>よくある質問</h2><details class="seo-faq"><summary>このツールは無料ですか？</summary><p>はい、100%無料です。会員登録不要。すべての処理はブラウザ内で行われ、データはサーバーに送信されません。</p></details><details class="seo-faq"><summary>スマホでも使えますか？</summary><p>はい、すべてのツールはレスポンシブ対応で、スマートフォン・タブレット・PCで利用できます。</p></details></div>
<div class="seo-section"><h2>関連ツール</h2><div class="seo-related"><a href="timezone-convert.html">タイムゾーン変換</a><a href="timestamp.html">タイムスタンプ変換</a></div></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">Share:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Copy URL</a></div>

<script>
const CITIES=[
{name:'東京',tz:'Asia/Tokyo'},{name:'ソウル',tz:'Asia/Seoul'},{name:'北京',tz:'Asia/Shanghai'},
{name:'ニューデリー',tz:'Asia/Kolkata'},{name:'ドバイ',tz:'Asia/Dubai'},{name:'イスタンブール',tz:'Europe/Istanbul'},
{name:'モスクワ',tz:'Europe/Moscow'},{name:'ロンドン',tz:'Europe/London'},{name:'パリ',tz:'Europe/Paris'},
{name:'ベルリン',tz:'Europe/Berlin'},{name:'ニューヨーク',tz:'America/New_York'},{name:'シカゴ',tz:'America/Chicago'},
{name:'ロサンゼルス',tz:'America/Los_Angeles'},{name:'サンパウロ',tz:'America/Sao_Paulo'},{name:'シドニー',tz:'Australia/Sydney'},
{name:'オークランド',tz:'Pacific/Auckland'}
];
function update(){const grid=document.getElementById('grid');grid.innerHTML='';CITIES.forEach(c=>{const now=new Date();const opts={timeZone:c.tz};const time=now.toLocaleTimeString('ja-JP',{...opts,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const date=now.toLocaleDateString('ja-JP',{...opts,month:'short',day:'numeric',weekday:'short'});const offset=new Intl.DateTimeFormat('en',{timeZone:c.tz,timeZoneName:'shortOffset'}).formatToParts(now).find(p=>p.type==='timeZoneName')?.value||'';const hour=parseInt(time.split(':')[0]);const isNight=hour<6||hour>=21;grid.innerHTML+=`<div class="clock-card" style="${isNight?'background:#1a1a2e;border-color:#2a2a4e;':''}"><div class="city" style="${isNight?'color:#aaa;':''}">${isNight?'🌙':'☀️'} ${c.name}</div><div class="time" style="${isNight?'color:#7eb8da;':''}">${time}</div><div class="date" style="${isNight?'color:#666;':''}">${date}</div><div class="offset">${offset}</div></div>`;});}
update();setInterval(update,1000);
</script>

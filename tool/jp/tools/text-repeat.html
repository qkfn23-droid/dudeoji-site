<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🔁 テキスト繰り返し</h1>
    <div class="calc-box">
        <div class="input-group"><label>テキスト</label><input type="text" id="text" placeholder="繰り返すテキスト" oninput="repeat()"></div>
        <div class="input-group"><label>繰り返し回数</label><input type="number" id="count" value="5" min="1" max="10000" oninput="repeat()"></div>
        <div class="input-group"><label>区切り文字</label><select id="sep" onchange="repeat()"><option value="\n">改行</option><option value=" ">スペース</option><option value=", ">カンマ</option><option value="">なし</option></select></div>
        <div class="btn-row"><button class="btn" onclick="document.getElementById('output').select();document.execCommand('copy')">📋 コピー</button></div>
        <div class="input-group"><label>結果</label><textarea id="output" readonly style="background:#f8f9fa;height:150px;"></textarea></div>
    </div>
</div>
<div class="seo-content">
<div class="seo-section"><h2>テキスト繰り返し</h2><p>テキストを指定した回数繰り返します。</p></div>
<div class="seo-section"><h2>よくある質問</h2><details class="seo-faq"><summary>このツールは無料ですか？</summary><p>はい、100%無料です。会員登録不要。すべての処理はブラウザ内で行われ、データはサーバーに送信されません。</p></details><details class="seo-faq"><summary>スマホでも使えますか？</summary><p>はい、すべてのツールはレスポンシブ対応で、スマートフォン・タブレット・PCで利用できます。</p></details></div>

<script>function repeat(){const t=document.getElementById('text').value,n=Math.min(parseInt(document.getElementById('count').value)||1,10000),s=document.getElementById('sep').value.replace('\\n','\n');document.getElementById('output').value=Array(n).fill(t).join(s);}</script>

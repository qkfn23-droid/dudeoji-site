<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>行の並び替えツール</h1>
    <p class="subtitle">テキストの行をさまざまな方法で並び替えます。</p>
    <textarea id="input" placeholder="1行に1つずつ入力してください..."></textarea>
    <div class="btn-row">
        <button class="btn btn-primary" onclick="sortLines('asc')">昇順 ↑</button>
        <button class="btn" onclick="sortLines('desc')">降順 ↓</button>
        <button class="btn" onclick="sortLines('random')">🔀 ランダム</button>
        <button class="btn" onclick="sortLines('reverse')">↕️ 逆順</button>
        <button class="btn" onclick="sortLines('unique')">🔹 重複削除</button>
        <button class="btn" onclick="sortLines('number')">🔢 数値順</button>
        <button class="btn" onclick="copy()">📋 コピー</button>
    </div>
    <textarea id="output" readonly style="background:#f8f9fa;"></textarea>
</div>
<div class="seo-content">
<div class="seo-section"><h2>行の並び替えツール</h2><p>テキストの行を昇順・降順・ランダムに並び替えます。</p></div>
<div class="seo-section"><h2>よくある質問</h2><details class="seo-faq"><summary>このツールは無料ですか？</summary><p>はい、100%無料です。会員登録不要。すべての処理はブラウザ内で行われ、データはサーバーに送信されません。</p></details><details class="seo-faq"><summary>スマホでも使えますか？</summary><p>はい、すべてのツールはレスポンシブ対応で、スマートフォン・タブレット・PCで利用できます。</p></details></div>

</div>

<script>
function sortLines(mode){const lines=document.getElementById('input').value.split('\n').filter(l=>l.trim());let result;switch(mode){case'asc':result=[...lines].sort((a,b)=>a.localeCompare(b));break;case'desc':result=[...lines].sort((a,b)=>b.localeCompare(a));break;case'random':result=[...lines];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}break;case'reverse':result=[...lines].reverse();break;case'unique':result=[...new Set(lines)];break;case'number':result=[...lines].sort((a,b)=>parseFloat(a)-parseFloat(b));break;}document.getElementById('output').value=result.join('\n');}
function copy(){document.getElementById('output').select();document.execCommand('copy');}
</script>

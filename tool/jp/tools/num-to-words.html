<script>
function numToJp(n){if(n===0)return'零';const u1=['','一','二','三','四','五','六','七','八','九'];const u2=['','万','億','兆','京'];let s='',neg=n<0;if(neg)n=-n;const str=String(n);const chunks=[];for(let i=str.length;i>0;i-=4)chunks.unshift(str.substring(Math.max(0,i-4),i));chunks.forEach((c,i)=>{const ci=chunks.length-1-i;const num=parseInt(c);if(num===0)return;let part='';const digits=[...c.padStart(4,'0')].map(Number);const units=['千','百','十',''];digits.forEach((d,j)=>{if(d>0)part+=(d===1&&j<3?'':u1[d])+units[j];});s+=part+u2[ci];});return(neg?'マイナス':'')+s;}
function numToEn(n){if(n===0)return'zero';const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];const scales=['','thousand','million','billion','trillion'];if(n<0)return'negative '+numToEn(-n);if(n<20)return ones[n];if(n<100)return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');if(n<1000)return ones[Math.floor(n/100)]+' hundred'+(n%100?' and '+numToEn(n%100):'');let s='',i=0;while(n>0){const chunk=n%1000;if(chunk)s=(numToEn(chunk)+' '+scales[i]+' '+s).trim();n=Math.floor(n/1000);i++;}return s.trim();}
function convert(){const n=parseInt(document.getElementById('num').value);if(isNaN(n)){document.getElementById('jp').textContent='-';document.getElementById('jpm').textContent='-';document.getElementById('en').textContent='-';return;}
document.getElementById('jp').textContent=numToJp(n);document.getElementById('jpm').textContent=numToJp(n)+'円';document.getElementById('en').textContent=numToEn(Math.abs(n));}
</script>

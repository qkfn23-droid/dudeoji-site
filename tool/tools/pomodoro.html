<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>🍅 포모도로 타이머</h1>
    <div class="timer-box">
        <div class="mode-btns">
            <button class="mode-btn active" onclick="setMode('work')">집중 25분</button>
            <button class="mode-btn break" onclick="setMode('short')">짧은 휴식 5분</button>
            <button class="mode-btn break" onclick="setMode('long')">긴 휴식 15분</button>
        </div>
        <div class="time-display work" id="display">25:00</div>
        <div class="status" id="status">시작을 눌러주세요</div>
        <div class="ctrl-btns">
            <button class="ctrl-btn btn-start" id="startBtn" onclick="toggle()">시작</button>
            <button class="ctrl-btn btn-reset" onclick="reset()">초기화</button>
        </div>
        <div class="sessions" id="sessions">완료한 세션: 0</div>
    </div>
</div>
<div class="seo-content">
<div class="seo-section"><h2>뽀모도로 타이머</h2><p>25분 집중 + 5분 휴식의 뽀모도로 기법을 위한 전용 타이머입니다. 생산성 향상에 효과적입니다.</p></div>
<div class="seo-section"><h2>자주 묻는 질문</h2><details class="seo-faq"><summary>뽀모도로 기법이란?</summary><p>25분 집중 후 5분 휴식을 반복하는 시간 관리 기법입니다. 4세트 완료 후 15~30분 긴 휴식을 취합니다.</p></details></div>
<div class="seo-section"><h2>관련 도구</h2><div class="seo-related"><a href="timer.html">타이머</a><a href="stopwatch.html">스톱워치</a></div></div>
</div>
<div style="text-align:center;padding:20px 0;border-top:1px solid #eee;margin-top:30px;"><span style="font-size:13px;color:#999;margin-right:8px;">공유하기:</span><a href="" onclick="window.open('https://twitter.com/intent/tweet?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(document.title),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1da1f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Twitter</a><a href="" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','width=600,height=400');return false" style="display:inline-block;padding:6px 12px;background:#1877f2;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">Facebook</a><a href="" onclick="window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(document.title+' '+location.href),'_blank');return false" style="display:inline-block;padding:6px 12px;background:#25d366;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">WhatsApp</a><a href="" onclick="navigator.clipboard.writeText(location.href);this.textContent='Copied!';return false" style="display:inline-block;padding:6px 12px;background:#888;color:#fff;border-radius:6px;text-decoration:none;font-size:12px;margin:4px;">URL 복사</a></div>
<footer>&copy; 2025 MOGU Tools</footer>
<script>
const MODES={work:25*60,short:5*60,long:15*60};
let mode='work',timeLeft=MODES.work,running=false,interval=null,sessions=0;
function setMode(m){mode=m;timeLeft=MODES[m];running=false;if(interval)clearInterval(interval);interval=null;render();document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.getElementById('startBtn').textContent='시작';document.getElementById('startBtn').className='ctrl-btn btn-start';document.getElementById('status').textContent='시작을 눌러주세요';}
function render(){const m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById('display').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('display').className='time-display '+(mode==='work'?'work':'break');}
function toggle(){if(running){running=false;clearInterval(interval);document.getElementById('startBtn').textContent='계속';document.getElementById('status').textContent='일시정지';}else{running=true;document.getElementById('startBtn').textContent='일시정지';document.getElementById('startBtn').className='ctrl-btn btn-stop';document.getElementById('status').textContent=mode==='work'?'🔥 집중 중...':'☕ 휴식 중...';interval=setInterval(()=>{timeLeft--;render();if(timeLeft<=0){clearInterval(interval);running=false;if(mode==='work'){sessions++;document.getElementById('sessions').textContent='완료한 세션: '+sessions;}document.getElementById('status').textContent='⏰ 완료!';document.getElementById('startBtn').textContent='시작';try{new Audio('data:audio/wav;base64,UklGRl9vT19teleWQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQ').play();}catch(e){}}},1000);}}
function reset(){running=false;if(interval)clearInterval(interval);timeLeft=MODES[mode];render();document.getElementById('startBtn').textContent='시작';document.getElementById('startBtn').className='ctrl-btn btn-start';document.getElementById('status').textContent='시작을 눌러주세요';}
render();
</script>
</body>

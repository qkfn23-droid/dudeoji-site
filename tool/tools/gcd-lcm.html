<div class="container">
    <h1>최대공약수 · 최소공배수</h1>
    <p class="subtitle">두 수의 GCD와 LCM을 계산합니다.</p>
    <div class="calc-box">
        <div class="input-row">
            <input type="number" id="a" placeholder="숫자 1" oninput="calc()">
            <input type="number" id="b" placeholder="숫자 2" oninput="calc()">
        </div>
        <div class="results">
            <div class="result-card"><div class="label">최대공약수 (GCD)</div><div class="val" id="gcd">-</div></div>

        </div>
    </div>
</div>
<div class="seo-content">
<div class="seo-section"><h2>최대공약수/최소공배수</h2><p>두 수의 최대공약수(GCD)와 최소공배수(LCM)를 자동 계산합니다. 유클리드 호제법을 사용합니다.</p></div>
<div class="seo-section"><h2>자주 묻는 질문</h2><details class="seo-faq"><summary>최대공약수는 어디에 쓰나요?</summary><p>분수의 약분, 비율 단순화, 프로그래밍의 알고리즘 문제 등에 사용됩니다.</p></details></div>

<script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;}
function calc(){const a=parseInt(document.getElementById('a').value),b=parseInt(document.getElementById('b').value);if(isNaN(a)||isNaN(b)||a===0||b===0){document.getElementById('gcd').textContent='-';document.getElementById('lcm').textContent='-';return;}const g=gcd(a,b);document.getElementById('gcd').textContent=g;document.getElementById('lcm').textContent=Math.abs(a*b)/g;}
</script>

<div class="container">
    <h1>화면 해상도 확인</h1>
    <p class="subtitle">현재 기기의 화면 정보를 확인합니다.</p>

    <div class="info-grid" id="infoGrid"></div>

    <div class="visual" id="visual"></div>
</div>

<div class="seo-content">
<div class="seo-section"><h2>화면 해상도 확인</h2><p>현재 사용 중인 디스플레이의 해상도, 색상 깊이, 픽셀 비율 등 화면 정보를 표시합니다.</p></div>
<div class="seo-section"><h2>자주 묻는 질문</h2><details class="seo-faq"><summary>디바이스 픽셀 비율이란?</summary><p>CSS 픽셀과 실제 물리적 픽셀의 비율입니다. 레티나 디스플레이는 2x 이상입니다.</p></details></div>
<div class="seo-section"><h2>관련 도구</h2><div class="seo-related"><a href="aspect-ratio.html">비율 계산기</a><a href="image-resize.html">이미지 리사이즈</a></div></div>
</div>

<footer>&copy; 2025 MOGU Tools</footer>

<script>
function detect() {
    const sw = screen.width, sh = screen.height;
    const bw = window.innerWidth, bh = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    const realW = Math.round(sw * dpr), realH = Math.round(sh * dpr);
    const colorDepth = screen.colorDepth;
    const orientation = sw > sh ? '가로 (Landscape)' : '세로 (Portrait)';
    const ua = navigator.userAgent;
    let os = 'Unknown';
    if (ua.includes('Windows')) os = 'Windows';
    else if (ua.includes('Mac')) os = 'macOS';
    else if (ua.includes('Linux')) os = 'Linux';
    else if (ua.includes('Android')) os = 'Android';
    else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';

    let browser = 'Unknown';
    if (ua.includes('Chrome') && !ua.includes('Edg')) browser = 'Chrome';
    else if (ua.includes('Firefox')) browser = 'Firefox';
    else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
    else if (ua.includes('Edg')) browser = 'Edge';

    const isMobile = /Mobi|Android|iPhone/i.test(ua);

    document.getElementById('infoGrid').innerHTML = `
        <div class="info-card"><div class="label">화면 해상도</div><div class="val">${sw} × ${sh}</div><div class="desc">CSS 픽셀 기준</div></div>
        <div class="info-card"><div class="label">실제 해상도</div><div class="val">${realW} × ${realH}</div><div class="desc">물리적 픽셀 (DPR 적용)</div></div>
        <div class="info-card"><div class="label">브라우저 크기</div><div class="val">${bw} × ${bh}</div><div class="desc">뷰포트 (스크롤바 제외)</div></div>
        <div class="info-card"><div class="label">픽셀 밀도 (DPR)</div><div class="val">${dpr}x</div><div class="desc">${dpr >= 2 ? '고밀도 (레티나급)' : '일반 밀도'}</div></div>
        <div class="info-card"><div class="label">화면 방향</div><div class="val">${orientation}</div></div>
        <div class="info-card"><div class="label">색상 깊이</div><div class="val">${colorDepth}bit</div></div>
        <div class="info-card"><div class="label">운영체제</div><div class="val">${os}</div></div>
        <div class="info-card"><div class="label">브라우저</div><div class="val">${browser}</div></div>
        <div class="info-card full"><div class="label">기기 유형</div><div class="val">${isMobile ? '📱 모바일' : '💻 데스크톱'}</div></div>
    `;

    // Visual
    const scale = 0.15;
    const vw = Math.round(sw * scale), vh = Math.round(sh * scale);
    const vbw = Math.round(bw * scale), vbh = Math.round(bh * scale);
    document.getElementById('visual').innerHTML = `
        <div class="screen-box" style="width:${vw}px;height:${vh}px;position:relative;">
            <div style="position:absolute;top:4px;left:4px;font-size:10px;color:#999;">${sw}×${sh}</div>
            <div style="border:2px dashed #27ae60;border-radius:4px;width:${vbw}px;height:${vbh}px;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
                <div style="font-size:9px;color:#27ae60;text-align:center;margin-top:${Math.max(vbh/2-8,2)}px;">${bw}×${bh}</div>
            </div>
        </div>
        <div class="screen-label">🔵 화면 해상도 &nbsp; 🟢 브라우저 뷰포트</div>
    `;
}

detect();
window.addEventListener('resize', detect);
</script>

<body>
<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>팁 계산기</h1>
    <p class="subtitle">팁 금액과 1인당 금액을 계산합니다.</p>
    <div class="calc-box">
        <div class="input-group"><label>금액</label><input type="number" id="amount" placeholder="50000" oninput="calc()"></div>
        <div class="tip-btns">
            <button class="tip-btn" onclick="setTip(10)">10%</button>
            <button class="tip-btn active" onclick="setTip(15)">15%</button>
            <button class="tip-btn" onclick="setTip(20)">20%</button>
            <button class="tip-btn" onclick="setTip(25)">25%</button>
        </div>
        <div class="input-group"><label>팁 비율 (%)</label><input type="number" id="tipRate" value="15" oninput="calc()"></div>
        <div class="input-group"><label>인원</label><input type="number" id="people" value="2" min="1" oninput="calc()"></div>
        <div class="result">
            <div class="big" id="totalResult">-</div>
            <div class="detail" id="detailResult">-</div>
        </div>
    </div>
</div>
<div class="seo-content">
<div class="seo-section"><h2>팁 계산기</h2><p>식사 금액과 팁 비율을 입력하면 팁 금액과 총 금액을 계산합니다. 인원수로 나누는 더치페이도 지원합니다.</p></div>
<div class="seo-section"><h2>자주 묻는 질문</h2><details class="seo-faq"><summary>적절한 팁 비율은?</summary><p>미국 기준 15~20%가 일반적입니다. 유럽은 5~10%, 한국/일본은 팁 문화가 없습니다.</p></details></div>
<div class="seo-section"><h2>관련 도구</h2><div class="seo-related"><a href="discount-calc.html">할인 계산기</a><a href="percent-calc.html">퍼센트 계산기</a></div></div>
</div>

<script>
function setTip(v){document.getElementById('tipRate').value=v;document.querySelectorAll('.tip-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');calc();}
function calc(){const a=parseFloat(document.getElementById('amount').value)||0;const t=parseFloat(document.getElementById('tipRate').value)||0;const p=parseInt(document.getElementById('people').value)||1;const tip=a*t/100;const total=a+tip;const per=total/p;document.getElementById('totalResult').textContent=total.toLocaleString()+'원';document.getElementById('detailResult').innerHTML=`팁: ${tip.toLocaleString()}원<br>1인당: ${per.toLocaleString()}원`;}
</script>

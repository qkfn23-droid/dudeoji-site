<script>
const WORDS='lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum fugiat nulla pariatur excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum'.split(' ');
function randWord(){return WORDS[Math.floor(Math.random()*WORDS.length)];}
function randSentence(){const len=8+Math.floor(Math.random()*12);let s=[];for(let i=0;i<len;i++)s.push(randWord());s[0]=s[0][0].toUpperCase()+s[0].slice(1);return s.join(' ')+'. ';}
function randParagraph(){const len=4+Math.floor(Math.random()*4);let p=[];for(let i=0;i<len;i++)p.push(randSentence());return p.join('');}
function generate(){const count=parseInt(document.getElementById('count').value)||3;const unit=document.getElementById('unit').value;let html='';if(unit==='paragraphs'){for(let i=0;i<count;i++)html+='<p>'+(i===0?'Lorem ipsum dolor sit amet, consectetur adipiscing elit. ':'')+randParagraph()+'</p>';}else if(unit==='sentences'){let s='';for(let i=0;i<count;i++)s+=randSentence();html='<p>'+s+'</p>';}else{let w=[];for(let i=0;i<count;i++)w.push(randWord());html='<p>'+w.join(' ')+'</p>';}document.getElementById('output').innerHTML=html;}
function copy(){const text=document.getElementById('output').innerText;navigator.clipboard.writeText(text);}
generate();
</script>

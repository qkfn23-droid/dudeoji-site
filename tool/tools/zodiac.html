<script>
const SIGNS=[
{name:'물병자리',emoji:'♒',en:'Aquarius',start:[1,20],end:[2,18],element:'공기',desc:'독립적이고 혁신적인 사고를 가졌습니다. 인도주의적이며 미래지향적입니다. 자유를 사랑하고 틀에 박힌 것을 싫어합니다.',match:'쌍둥이자리, 천칭자리'},
{name:'물고기자리',emoji:'♓',en:'Pisces',start:[2,19],end:[3,20],element:'물',desc:'감수성이 풍부하고 직관이 뛰어납니다. 예술적 재능이 있으며 꿈꾸는 로맨티스트입니다. 공감 능력이 탁월합니다.',match:'게자리, 전갈자리'},
{name:'양자리',emoji:'♈',en:'Aries',start:[3,21],end:[4,19],element:'불',desc:'열정적이고 에너지가 넘칩니다. 리더십이 강하고 도전을 좋아합니다. 직선적이고 솔직한 성격입니다.',match:'사자자리, 사수자리'},
{name:'황소자리',emoji:'♉',en:'Taurus',start:[4,20],end:[5,20],element:'흙',desc:'안정적이고 신뢰할 수 있습니다. 인내심이 강하고 실용적입니다. 미식가이며 편안함을 추구합니다.',match:'처녀자리, 염소자리'},
{name:'쌍둥이자리',emoji:'♊',en:'Gemini',start:[5,21],end:[6,20],element:'공기',desc:'호기심이 많고 재치 있습니다. 소통 능력이 뛰어나고 다재다능합니다. 변화를 좋아합니다.',match:'물병자리, 천칭자리'},
{name:'게자리',emoji:'♋',en:'Cancer',start:[6,21],end:[7,22],element:'물',desc:'가정적이고 보호 본능이 강합니다. 감정이 풍부하고 직관적입니다. 사랑하는 사람을 위해 헌신합니다.',match:'전갈자리, 물고기자리'},
{name:'사자자리',emoji:'♌',en:'Leo',start:[7,23],end:[8,22],element:'불',desc:'카리스마 있고 자신감이 넘칩니다. 관대하고 창의적이며 주목받는 것을 좋아합니다. 타고난 리더입니다.',match:'양자리, 사수자리'},
{name:'처녀자리',emoji:'♍',en:'Virgo',start:[8,23],end:[9,22],element:'흙',desc:'분석적이고 세심합니다. 완벽주의적이며 실용적입니다. 건강과 질서를 중시합니다.',match:'황소자리, 염소자리'},
{name:'천칭자리',emoji:'♎',en:'Libra',start:[9,23],end:[10,22],element:'공기',desc:'균형과 조화를 추구합니다. 사교적이고 매력적이며 공정함을 중시합니다. 예술적 감각이 뛰어납니다.',match:'쌍둥이자리, 물병자리'},
{name:'전갈자리',emoji:'♏',en:'Scorpio',start:[10,23],end:[11,21],element:'물',desc:'강렬하고 열정적입니다. 통찰력이 뛰어나고 의지가 강합니다. 비밀을 잘 지키며 충성스럽습니다.',match:'게자리, 물고기자리'},
{name:'사수자리',emoji:'♐',en:'Sagittarius',start:[11,22],end:[12,21],element:'불',desc:'모험을 사랑하고 낙관적입니다. 자유롭고 철학적이며 유머 감각이 뛰어납니다. 여행을 좋아합니다.',match:'양자리, 사자자리'},
{name:'염소자리',emoji:'♑',en:'Capricorn',start:[12,22],end:[1,19],element:'흙',desc:'야망이 있고 책임감이 강합니다. 인내심 있게 목표를 향해 나아갑니다. 현실적이고 성실합니다.',match:'황소자리, 처녀자리'}
];
function getSign(m,d){for(const s of SIGNS){const[sm,sd]=s.start,[em,ed]=s.end;if(sm<=em){if((m===sm&&d>=sd)||(m===em&&d<=ed)||(m>sm&&m<em))return s;}else{if((m===sm&&d>=sd)||(m===em&&d<=ed)||m>sm||m<em)return s;}}return SIGNS[0];}
function check(){const m=parseInt(document.getElementById('month').value),d=parseInt(document.getElementById('day').value);const s=getSign(m,d);document.getElementById('result').innerHTML=`<div class="emoji">${s.emoji}</div><div class="name">${s.name} (${s.en})</div><div class="date">${s.start[0]}/${s.start[1]} ~ ${s.end[0]}/${s.end[1]}</div><div class="tags"><span class="tag">${s.element} 원소</span><span class="tag">궁합: ${s.match}</span></div><div class="desc">${s.desc}</div>`;document.getElementById('result').style.display='block';}
const ms=document.getElementById('month'),ds=document.getElementById('day');
for(let i=1;i<=12;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'월';if(i===3)o.selected=true;ms.appendChild(o);}
for(let i=1;i<=31;i++){const o=document.createElement('option');o.value=i;o.textContent=i+'일';if(i===15)o.selected=true;ds.appendChild(o);}
check();
</script>

<div class="container"><h1>📊 CSV → JSON 변환기</h1>
<label>CSV 입력 (첫 줄 = 헤더)</label>
<textarea id="input" placeholder="이름,나이,도시&#10;홍길동,30,서울&#10;김철수,25,부산" oninput="convert()"></textarea>
<div class="btn-row"><button class="btn btn-primary" onclick="convert()">변환</button><button class="btn" onclick="document.getElementById('output').select();document.execCommand('copy')">📋 복사</button></div>
<label>JSON 결과</label>
<textarea id="output" readonly style="background:#f8f9fa;"></textarea>
</div><div class="seo-content">
<div class="seo-section"><h2>CSV ↔ JSON 변환기</h2><p>CSV 데이터를 JSON으로, JSON 데이터를 CSV로 상호 변환합니다. 데이터 형식 변환에 필수적인 개발자 도구입니다.</p></div>
<div class="seo-section"><h2>자주 묻는 질문</h2><details class="seo-faq"><summary>CSV와 JSON의 차이는?</summary><p>CSV는 표 형식(엑셀처럼), JSON은 키-값 쌍 형식입니다. API는 주로 JSON, 스프레드시트는 CSV를 사용합니다.</p></details></div>

<script>
function convert(){try{const lines=document.getElementById('input').value.trim().split('\n');if(lines.length<2){document.getElementById('output').value='';return;}
const headers=lines[0].split(',').map(h=>h.trim());const data=lines.slice(1).map(line=>{const vals=line.split(',');const obj={};headers.forEach((h,i)=>obj[h]=vals[i]?.trim()||'');return obj;});
document.getElementById('output').value=JSON.stringify(data,null,2);}catch(e){document.getElementById('output').value='오류: '+e.message;}}
</script></body></html>

<div class="seo-section"><h2>마크다운 미리보기</h2><p>마크다운 문법으로 작성한 텍스트를 실시간으로 HTML로 렌더링하여 미리봅니다. 블로그, README 작성 시 유용합니다.</p></div>

<script>
function md2html(md){return md
.replace(/^### (.*$)/gm,'<h3>$1</h3>')
.replace(/^## (.*$)/gm,'<h2>$1</h2>')
.replace(/^# (.*$)/gm,'<h1>$1</h1>')
.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
.replace(/\*(.+?)\*/g,'<em>$1</em>')
.replace(/`(.+?)`/g,'<code>$1</code>')
.replace(/^> (.*$)/gm,'<blockquote>$1</blockquote>')
.replace(/^- (.*$)/gm,'<li>$1</li>')
.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>')
.replace(/^\d+\. (.*$)/gm,'<li>$1</li>')
.replace(/^---$/gm,'<hr>')
.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>')
.replace(/!\[(.+?)\]\((.+?)\)/g,'<img src="$2" alt="$1">')
.replace(/\n\n/g,'</p><p>')
.replace(/^(?!<[hublop])/gm,function(m){return m?'<p>'+m:m;});}
function render(){document.getElementById('preview').innerHTML=md2html(document.getElementById('input').value);}
function copy(){const html=md2html(document.getElementById('input').value);navigator.clipboard.writeText(html);}
document.getElementById('input').value='# 마크다운 에디터\n\n**굵게** *기울임* `코드`\n\n## 기능\n\n- 실시간 미리보기\n- HTML 변환\n- 복사 가능\n\n> 인용문 예시\n\n---\n\n[MOGU Tools](https://mogutool.com)';
render();
</script>

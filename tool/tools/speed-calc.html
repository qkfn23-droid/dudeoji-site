<header><a href="../index.html">MOGU <span>Tools</span></a></header>
<div class="container">
    <h1>속도 · 거리 · 시간 계산기</h1>
    <p class="subtitle">셋 중 두 개를 입력하면 나머지 하나를 계산합니다.</p>
    <div class="calc-box">
        <div class="input-group"><label>속도 (km/h)</label><input type="number" id="speed" oninput="calc()" placeholder="비워두면 계산"></div>
        <div class="input-group"><label>거리 (km)</label><input type="number" id="dist" oninput="calc()" placeholder="비워두면 계산"></div>
        <div class="input-group"><label>시간 (시간)</label><input type="number" id="time" oninput="calc()" step="0.1" placeholder="비워두면 계산"></div>
        <div class="result"><div class="big" id="result">값 2개를 입력하세요</div></div>
    </div>
</div>
<div class="seo-content">
<div class="seo-section"><h2>속도 계산기</h2><p>거리와 시간을 입력하면 속도를 계산합니다. km/h, m/s, mph 등 다양한 속도 단위를 지원합니다.</p></div>
<div class="seo-section"><h2>자주 묻는 질문</h2><details class="seo-faq"><summary>시속 100km는 초속 몇m?</summary><p>시속 100km = 약 27.78m/s입니다. (100 ÷ 3.6)</p></details></div>

</div>

<script>
function calc(){const s=document.getElementById('speed').value,d=document.getElementById('dist').value,t=document.getElementById('time').value;const sv=parseFloat(s),dv=parseFloat(d),tv=parseFloat(t);let r='값 2개를 입력하세요';if(s&&d&&!t){r=`시간: ${(dv/sv).toFixed(2)} 시간 (${Math.round(dv/sv*60)}분)`;}else if(s&&!d&&t){r=`거리: ${(sv*tv).toFixed(2)} km`;}else if(!s&&d&&t){r=`속도: ${(dv/tv).toFixed(2)} km/h`;}else if(s&&d&&t){r=`속도:${sv} 거리:${dv} 시간:${tv} (모두 입력됨)`;}document.getElementById('result').innerHTML=r;}
</script>

<div class="calc-box"><h2>숫자 → 로마 숫자</h2><input type="number" id="num" placeholder="2024" min="1" max="3999" oninput="toRoman()"><div class="result" id="roman">-</div></div>
<div class="calc-box"><h2>로마 숫자 → 숫자</h2><input type="text" id="romanIn" placeholder="MMXXIV" oninput="toNum()" style="text-transform:uppercase"><div class="result" id="numOut">-</div></div>

<script>
function toRoman(){let n=parseInt(document.getElementById('num').value);if(!n||n<1||n>3999){document.getElementById('roman').textContent='-';return;}
const vals=[1000,900,500,400,100,90,50,40,10,9,5,4,1],syms=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];let r='';for(let i=0;i<vals.length;i++)while(n>=vals[i]){r+=syms[i];n-=vals[i];}document.getElementById('roman').textContent=r;}
function toNum(){const s=document.getElementById('romanIn').value.toUpperCase();const map={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let r=0;for(let i=0;i<s.length;i++){const c=map[s[i]],n=map[s[i+1]];if(!c){document.getElementById('numOut').textContent='?';return;}r+=n&&c<n?-c:c;}document.getElementById('numOut').textContent=r||'-';}
</script></body></html>

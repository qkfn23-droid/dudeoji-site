<div class="container"><h1>🖼️ 텍스트 → 이미지</h1>

<script>
function render(){const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const text=document.getElementById('text').value||' ';const size=parseInt(document.getElementById('size').value)||48;ctx.font=size+'px sans-serif';const lines=text.split('\n');const widths=lines.map(l=>ctx.measureText(l).width);canvas.width=Math.max(...widths)+size;canvas.height=lines.length*(size*1.3)+size;ctx.fillStyle=document.getElementById('bg').value;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle=document.getElementById('color').value;ctx.font=size+'px sans-serif';ctx.textBaseline='top';lines.forEach((l,i)=>ctx.fillText(l,size/2,size/2+i*size*1.3));}
function download(){const a=document.createElement('a');a.download='text-image.png';a.href=document.getElementById('canvas').toDataURL();a.click();}
render();
